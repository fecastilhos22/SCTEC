<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Calculadora</title>
    <script src="calculadora.js"></script>
</head>
<body>
    <h1>Calculadora básica</h1>
    <p>Operadores válidos: +, -, *, / </p>
    <input type="text" id="num1" placeholder="Primeiro número"/><!--placeholder é para aparecer o que o usuário precisa digitar dentro do input-->
    <input type="text" id="num2" placeholder="Segundo número"/>
    <input type="text" id="operador" placeholder="Operador"/>
    <button onclick="efetuaOperacao()">Efetuar a operação</button>
    <p id="resultado"></p>
    
</body>
</html>
