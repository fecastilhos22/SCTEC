<!DOCTYPE html>
<html lang="pt-br">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Desafio</title>
</head>

<body>
    <header>
        <h1>Desafio 1</h1>

        <nav>

            <h2>Formulário de inscrição</h2>

        </nav>

    </header>

    </section>


    <form action="" id="form">
        <label for="nome">Nome completo: </label>
        <input type="text" id="nome" name="nome" required><br>

        <label for="email">E-mail: </label>
        <input type="email" id="email" name="email" required><br>

        <label for="idade">Idade: </label>
        <input type="idade" id="idade" name="idade"><br>

        <label for="assunto">Para qual matéria vocês está se candidatando para lecionar: </label>
        <select name="assunto" id="assunto">
            <option value="matematica">Matemática</option>
            <option value="portugues">Português</option>
            <option value="biologia">Biologia</option>
            <option value="ciencias">Ciência</option>
            <option value="historia">História</option>
            <option value="geografia">Geografia</option>
            <option value="artes">Artes</option>
        </select>    
        <br>
        <label for="turno">Turnos Disponíveis: </label>
        <select name="turno" id="turno">
                <option value="manha">Manhã</option>
                <option value="tarde">Tarde</option>
                <option value="noite">Noite</option>
        </select>       
        <br>

        <label for="escolaridade">Nível de escolaridade: </label>
        <select name="escolaridade" id="escolaridade">
                <option value="superiorCompleto">Ensino Superior Completo</option>
                <option value="cursandoMestrado">Cursando Mestrado</option>
                <option value="mestradoCompleto">Mestrado Completo</option>
                <option value="cursandoDoutorado">Cursando Doutorado</option>
                <option value="doutoradoCompleto">Doutorado Completo</option>
        </select>        
        

        <br>
        <label for="descricao">Descrição sobre si mesmo: </label>
        <textarea name="descricao" id="descricao" cols="100" rows="5" required maxlength="200"
                placeholder="Escreva até 200 caracteres..."></textarea><br>

        <br>

        <input type="submit" value="Enviar Descrição">



    </form>


    </section>
    <footer>

        <section id="retorno">

            <h3>Entraremos em contato após análise.</h3>

    </footer>

</body>

</html>
